<svg width="900" height="24" viewBox="0 0 900 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="divider">
<defs>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
    <stop offset="20%" stop-color="#a78bfa"/>
    <stop offset="80%" stop-color="#f472b6"/>
    <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="0" y="11" width="900" height="2" fill="url(#line)" filter="url(#glow)"/>
<rect x="-120" y="10" width="120" height="4" fill="url(#scan)"><animate attributeName="x" values="-120;900" dur="3.5s" repeatCount="indefinite"/></rect>
<g fill="none" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)">
  <rect x="436" y="5" width="14" height="14" transform="rotate(45 443 12)"/>
</g>
<rect x="457" y="5" width="14" height="14" fill="#f472b6" opacity="0.8" transform="rotate(45 464 12)" filter="url(#glow)"><animate attributeName="opacity" values="0.8;0.25;0.8" dur="1.6s" repeatCount="indefinite"/></rect>
</svg>
