    <text x="30" y="142" fill="#a78bfa" opacity="0">&gt; Full-Stack Web Developer<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.262;0.488;0.500;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="30" y="142" fill="#a78bfa" opacity="0">&gt; AI/ML Innovator<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.512;0.738;0.750;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="30" y="142" fill="#a78bfa" opacity="0">&gt; Open Source Builder<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.750;0.762;0.988;1.000;1" dur="15s" repeatCount="indefinite"/></text>
  </g>
  <line x1="30" y1="164" x2="690" y2="164" stroke="rgba(255,255,255,.08)" stroke-width="1"/>

  <!-- datos -->
  <g font-family="'Consolas', 'Fira Code', monospace" font-size="13">
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.2s" fill="freeze"/><circle cx="36" cy="191" r="3" fill="#a78bfa"/><text x="50" y="196" fill="#8b949e">Location:</text><text x="190" y="196" font-weight="600" fill="#f0f6fc">Global</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.5s" fill="freeze"/><circle cx="36" cy="218" r="3" fill="#a78bfa"/><text x="50" y="223" fill="#8b949e">Education:</text><text x="190" y="223" font-weight="600" fill="#f0f6fc">Computer Science &amp; Software Development</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.8s" fill="freeze"/><circle cx="36" cy="245" r="3" fill="#a78bfa"/><text x="50" y="250" fill="#8b949e">Current Focus:</text><text x="190" y="250" font-weight="600" fill="#f0f6fc">Web Design</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.1s" fill="freeze"/><circle cx="36" cy="272" r="3" fill="#a78bfa"/><text x="50" y="277" fill="#8b949e">GitHub:</text><text x="190" y="277" font-weight="600" fill="#f472b6">github.com/FabrizioRodriguez-Tech</text></g>
  </g>

  <!-- estado (antes estaba debajo de la foto) -->
  <text x="30" y="316" font-family="'Consolas', 'Fira Code', monospace" font-size="13.5" fill="#8b949e">$ echo $STATUS</text>
  <circle cx="36" cy="336" r="4.5" fill="#a78bfa"><animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="50" y="340" font-family="'Consolas', 'Fira Code', monospace" font-size="13" fill="#9ca3af">available for opportunities <tspan fill="#8b949e">// Hello awa</tspan></text>

