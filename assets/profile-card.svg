  <text x="30" y="378" font-family="'Consolas', 'Fira Code', monospace" font-size="13.5" fill="#8b949e">$ ls ./tech-stack</text>
  <g font-family="'Fira Code', 'Consolas', monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">
