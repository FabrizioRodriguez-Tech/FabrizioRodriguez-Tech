    <g transform="translate(107, 394)"><rect width="54" height="26" rx="10" fill="rgba(244,114,182,0.12)" stroke="#f472b6"/><text x="27" y="17">HTML</text></g>
    <g transform="translate(169, 394)"><rect width="52" height="26" rx="10" fill="rgba(167,139,250,0.12)" stroke="#a78bfa"/><text x="26" y="17">C#</text></g>
    <g transform="translate(229, 394)"><rect width="99" height="26" rx="10" fill="rgba(244,114,182,0.12)" stroke="#f472b6"/><text x="49.5" y="17">TypeScript</text></g>
    <g transform="translate(336, 394)"><rect width="54" height="26" rx="10" fill="rgba(167,139,250,0.12)" stroke="#a78bfa"/><text x="27" y="17">Java</text></g>
    <g transform="translate(398, 394)"><rect width="99" height="26" rx="10" fill="rgba(244,114,182,0.12)" stroke="#f472b6"/><text x="49.5" y="17">PostgreSQL</text></g>
    <g transform="translate(505, 394)"><rect width="52" height="26" rx="10" fill="rgba(167,139,250,0.12)" stroke="#a78bfa"/><text x="26" y="17">AWS</text></g>
    <g transform="translate(565, 394)"><rect width="52" height="26" rx="10" fill="rgba(244,114,182,0.12)" stroke="#f472b6"/><text x="26" y="17">Git</text></g>
    <g transform="translate(30, 428)"><rect width="61.5" height="26" rx="10" fill="rgba(167,139,250,0.12)" stroke="#a78bfa"/><text x="30.75" y="17">Linux</text></g>
    <g transform="translate(99.5, 428)"><rect width="61.5" height="26" rx="10" fill="rgba(244,114,182,0.12)" stroke="#f472b6"/><text x="30.75" y="17">React</text></g>
    <g transform="translate(169, 428)"><rect width="76.5" height="26" rx="10" fill="rgba(167,139,250,0.12)" stroke="#a78bfa"/><text x="38.25" y="17">Node.JS</text></g>
  </g>
