<svg width="480" height="260" viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="about me - terminal">
<defs>
  <clipPath id="c"><rect width="480" height="260" rx="14"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="480" height="260" fill="#0c0a16"/>
  <rect x="0.75" y="0.75" width="478.5" height="258.5" rx="13.5" fill="none" stroke="rgba(167,139,250,.35)" stroke-width="1.5"/>

  <!-- barra de título -->
  <rect width="480" height="32" fill="#221c3d"/>
  <circle cx="20" cy="16" r="5.5" fill="#ff5f56" opacity=".9"/>
  <circle cx="38" cy="16" r="5.5" fill="#ffbd2e" opacity=".9"/>
  <circle cx="56" cy="16" r="5.5" fill="#27c93f" opacity=".9"/>
  <text x="240" y="20.5" text-anchor="middle" font-family="'Consolas','Fira Code',monospace" font-size="12" fill="#8b949e">about_me.txt — zsh</text>

  <g font-family="'Consolas','Fira Code',monospace" font-size="16" xml:space="preserve">
    <!-- comando -->
    <text x="22" y="64"><tspan fill="#f472b6">fabrizio@grid</tspan><tspan fill="#a78bfa">:~$</tspan><tspan fill="#f0f6fc"> cat about_me.txt</tspan></text>

    <!-- líneas con aparición escalonada -->
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".35s" begin=".3s" fill="freeze"/>
      <text x="22" y="96"><tspan fill="#f472b6">&gt;</tspan><tspan fill="#f0f6fc"> Software Engineering student</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".35s" begin=".6s" fill="freeze"/>
      <text x="22" y="120"><tspan fill="#f472b6">&gt;</tspan><tspan fill="#f0f6fc"> Construyo apps y las despliego</tspan></text>
      <text x="22" y="144"><tspan fill="#f0f6fc">  seguras y eficientes en la nube</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".35s" begin=".9s" fill="freeze"/>
      <text x="22" y="168"><tspan fill="#f472b6">&gt;</tspan><tspan fill="#a78bfa"> Focus</tspan><tspan fill="#6b6290"> .....</tspan><tspan fill="#f0f6fc"> AWS + Cybersecurity</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".35s" begin="1.2s" fill="freeze"/>
      <text x="22" y="192"><tspan fill="#f472b6">&gt;</tspan><tspan fill="#a78bfa"> Stack</tspan><tspan fill="#6b6290"> .....</tspan><tspan fill="#f0f6fc"> Java · TypeScript · Linux</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".35s" begin="1.5s" fill="freeze"/>
      <text x="22" y="216"><tspan fill="#f472b6">&gt;</tspan><tspan fill="#a78bfa"> Idiomas</tspan><tspan fill="#6b6290"> ...</tspan><tspan fill="#f0f6fc"> ES / EN</tspan></text></g>

    <!-- prompt final con cursor parpadeante -->
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".35s" begin="1.8s" fill="freeze"/>
      <text x="22" y="244"><tspan fill="#f472b6">fabrizio@grid</tspan><tspan fill="#a78bfa">:~$ </tspan><tspan fill="#a78bfa">▋<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;.5;.51;1" dur="1s" repeatCount="indefinite"/></tspan></text>
    </g>
  </g>
</g>
</svg>
